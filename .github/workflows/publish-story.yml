name: Publish Agent Story

on:
  workflow_dispatch:
    inputs:
      run_file:
        description: Run log to publish
        required: true
        default: agent-run.jsonl
      title:
        description: Optional Story title
        required: false
        default: My first Agent Story
      visibility:
        description: Who can discover this Story?
        required: true
        default: unlisted
        type: choice
        options:
          - unlisted
          - public
          - private

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Publish Agent Story
        id: story
        uses: sunfishloop/publish-agent-story@v1.2.1
        with:
          run-file: ${{ inputs.run_file }}
          title: ${{ inputs.title }}
          visibility: ${{ inputs.visibility }}

      - name: Confirm the published Story
        run: |
          test -n "${{ steps.story.outputs.story-id }}"
          echo "Published Story: ${{ steps.story.outputs.story-url }}"
